name: Trials
on:
  workflow_dispatch:
    inputs:
      use_ai:
        description: "Use AI synonyms (needs the GROQ_API_KEY secret)"
        type: boolean
        default: false
      engine:
        description: "Search engine to measure (needs the repertory loaded for on / hybrid)"
        type: choice
        options: [off, on, hybrid]
        default: "off"
jobs:
  trials:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: HomeoCare } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - run: npx tsx server/trials/run.ts
        env:
          SCRAPER_SUPABASE_URL: ${{ secrets.SCRAPER_SUPABASE_URL }}
          SCRAPER_SUPABASE_KEY: ${{ secrets.SCRAPER_SUPABASE_KEY }}
          GROQ_API_KEY: ${{ inputs.use_ai && secrets.GROQ_API_KEY || '' }}
          REPERTORY_ENGINE: ${{ inputs.engine }}
