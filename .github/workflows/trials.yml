name: Trials
on: workflow_dispatch
jobs:
  trials:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: HomeoCare } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - run: npx tsx server/trials/run.ts
        env:
          SCRAPER_SUPABASE_URL: ${{ secrets.SCRAPER_SUPABASE_URL }}
          SCRAPER_SUPABASE_KEY: ${{ secrets.SCRAPER_SUPABASE_KEY }}
